name: Release
on:
  push:
    paths: [release/version.txt]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0 or v1.0.0-rc.1
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: python3 tools/release.py
  portable:
    needs: plan
    uses: ./.github/workflows/portable.yml
    with:
      package_version: ${{ needs.plan.outputs.version }}
  legacy:
    needs: plan
    uses: ./.github/workflows/build.yml
  legacy-readback:
    needs: [plan, portable, legacy]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GARbro-Mod-ci-build
          path: artifacts/legacy
      - uses: actions/download-artifact@v4
        with:
          name: portable-tests-windows-latest
          path: artifacts/portable-validation
      - name: Compare all created archives with the original Windows readers
        shell: powershell
        run: |
          $manifest=Get-ChildItem artifacts/portable-validation -Filter created-archives.json -Recurse | Select-Object -First 1
          if(-not $manifest){throw 'Creation validation manifest is missing.'}
          ./tools/test-created-archives.ps1 -Directory artifacts/legacy -Manifest $manifest.FullName
  publish:
    needs: [plan, portable, legacy, legacy-readback]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG_INPUT: ${{ needs.plan.outputs.tag }}
      RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
      RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: artifacts/release
      - run: python3 tools/release.py --artifacts artifacts/release --revision "$GITHUB_SHA"
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG_INPUT" artifacts/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GARbro $RELEASE_TAG_INPUT" --notes-file "$RELEASE_NOTES" --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG_INPUT" --repo "$GITHUB_REPOSITORY" --draft=false
