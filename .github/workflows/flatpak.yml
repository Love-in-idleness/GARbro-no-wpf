name: Flatpak preparation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'tools/*flatpak*'
      - 'tools/*flathub*'
      - '.github/workflows/flatpak.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build and validation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.dotnet10//25.08
      - name: Generate immutable sources with the actual SDK
        run: dbus-run-session -- python3 tools/prepare-flathub.py --in-sdk --revision "$GITHUB_SHA"
      - name: Validate application metadata
        run: |
          python3 tools/check-flatpak.py
          appstreamcli validate --no-net packaging/flatpak/*.metainfo.xml
      - name: Build without network access in the build sandbox
        run: |
          dbus-run-session -- flatpak-builder --user --force-clean --repo=artifacts/flatpak-repo --install-deps-from=flathub build-flatpak artifacts/flathub/io.github.love_in_idleness.GARbro-no-wpf.json
          flatpak build-bundle artifacts/flatpak-repo artifacts/GARbro-${{ matrix.arch }}.flatpak io.github.love_in_idleness.GARbro-no-wpf
      - name: Verify self-contained CLI and worker in the sandbox
        run: |
          dbus-run-session -- flatpak-builder --run build-flatpak artifacts/flathub/io.github.love_in_idleness.GARbro-no-wpf.json garbro --help
          dbus-run-session -- flatpak-builder --run build-flatpak artifacts/flathub/io.github.love_in_idleness.GARbro-no-wpf.json sh -c 'test -e /app/lib/garbro/desktop/libcoreclr.so; test -x /app/lib/garbro/desktop/GARbro.Worker; ldconfig -p | grep libSDL2'
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-preparation-${{ matrix.arch }}
          path: |
            artifacts/*.flatpak
            artifacts/flathub/
