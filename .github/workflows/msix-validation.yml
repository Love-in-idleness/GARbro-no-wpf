name: MSIX validation
on:
  push:
    paths: [.github/workflows/msix-validation.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate without publishing
        type: string
        default: 0.2.0-preview.1
permissions:
  contents: read
concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - shell: bash
        run: python tools/package-release.py --rid win-x64 --version "$GARBRO_PACKAGE_VERSION" --installer
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.version || '0.2.0-preview.1' }}
      - shell: pwsh
        run: tools/smoke-msix.ps1 -Output artifacts -Version "${{ inputs.version || '0.2.0-preview.1' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-validation
          path: |
            artifacts/*.zip
            artifacts/*.msix
            artifacts/*.cer
            artifacts/msix-test/
