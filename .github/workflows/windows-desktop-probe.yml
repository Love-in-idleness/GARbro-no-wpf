name: Windows desktop readiness
on:
  push:
    branches: [migration/net10]
    paths: ['tools/prepare-windows-desktop.ps1', '.github/workflows/windows-desktop-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify the disposable desktop
        shell: powershell
        run: tools/prepare-windows-desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-readiness
          path: artifacts/desktop-readiness
