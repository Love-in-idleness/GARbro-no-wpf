name: Portable .NET
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      package_version:
        type: string
        default: 0.1.0-migration
concurrency:
  group: portable-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tools/tests
      - run: python tools/inventory-formats.py --check
      - run: dotnet build GARbro.NoWpf.slnx -c Release
      - run: dotnet test GARbro.NoWpf.slnx -c Release --no-build --logger "trx;LogFilePrefix=portable"
      - name: Exercise native desktop window on X11
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a python tools/smoke-desktop.py
      - name: Exercise native desktop window
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: python tools/smoke-desktop.py
      - run: python tools/smoke-cli.py
      - run: python tools/package-release.py --rid ${{ matrix.rid }}
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.package_version || '0.1.0-migration' }}
      - run: python tools/smoke-package.py --rid ${{ matrix.rid }}
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.package_version || '0.1.0-migration' }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-tests-${{ matrix.os }}
          path: |
            tests/**/TestResults/*.trx
            artifacts/native-desktop/window.png
