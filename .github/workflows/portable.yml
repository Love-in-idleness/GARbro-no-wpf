name: Portable .NET
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/inventory-formats.py --check
      - run: dotnet test GARbro.NoWpf.slnx -c Release --logger "trx;LogFilePrefix=portable"
      - run: python tools/smoke-cli.py
      - run: python tools/package-release.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-tests-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
