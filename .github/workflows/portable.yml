name: Portable .NET
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:
    inputs:
      package_version:
        type: string
        default: 0.3.0-preview.1
concurrency:
  group: portable-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tools/tests
      - run: python tools/inventory-formats.py --check
      - run: python tools/check-ui-localization.py
      - name: Install Linux system audio library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0
      - run: dotnet build GARbro.NoWpf.slnx -c Release
      - run: dotnet test GARbro.NoWpf.slnx -c Release --no-build --logger "trx;LogFilePrefix=portable"
        env:
          SDL_AUDIODRIVER: dummy
          GARBRO_CREATED_ARCHIVES: ${{ matrix.rid == 'win-x64' && format('{0}/artifacts/created-archives', github.workspace) || '' }}
      - name: Exercise native desktop window on X11
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a python tools/smoke-desktop.py
      - name: Exercise native desktop window
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: python tools/smoke-desktop.py
      - name: Install headless Wayland test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends sway libwayland-dev libxkbcommon-dev libgles2
      - name: Verify native Wayland text input
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: python tools/smoke-wayland.py
      - run: python tools/smoke-cli.py
      - name: Compare public release corpus
        timeout-minutes: 6
        run: python tools/check-public-corpus.py
      - name: Build archives and platform installers
        shell: bash
        run: |
          flags=()
          if [[ "${{ matrix.rid }}" == linux-* || "${{ matrix.rid }}" == win-* ]]; then flags+=(--installer); fi
          python tools/package-release.py --rid ${{ matrix.rid }} "${flags[@]}"
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.package_version || '0.3.0-preview.1' }}
      - run: python tools/smoke-package.py --rid ${{ matrix.rid }}
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.package_version || '0.3.0-preview.1' }}
      - name: Install and launch DEB on both supported distributions
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: python tools/smoke-deb.py artifacts/garbro-${{ inputs.package_version || '0.3.0-preview.1' }}-${{ matrix.rid }}.deb
      - name: Verify MSIX install, activation, upgrade and removal
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: tools/smoke-msix.ps1 -Output artifacts -Architecture ${{ matrix.rid == 'win-arm64' && 'arm64' || 'x64' }} -Version "${{ inputs.package_version || '0.3.0-preview.1' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.msix
            artifacts/*.cer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-tests-${{ matrix.os }}
          path: |
            tests/**/TestResults/*.trx
            artifacts/native-desktop/window.png
            artifacts/wayland-ime/
            artifacts/public-corpus.json
            artifacts/created-archives/
