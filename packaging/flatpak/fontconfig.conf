<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- shortcut: Exclude web fonts until Skia's family enumeration handles
       FcResultNoMatch; host WOFF cache entries can lack a family and hang it.
       https://bugs.webkit.org/show_bug.cgi?id=325185 -->
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
